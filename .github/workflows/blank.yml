name: Build Soundcraft from Zip

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: 'Name of the uploaded .zip file in the repo'
        required: true
        default: 'soundcraft-piano-roll-v2.zip'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers \
            libgl1-mesa-dev libasound2-dev unzip

      - name: Unpack uploaded zip
        run: |
          ZIP_NAME="${{ github.event.inputs.zip_file || 'soundcraft-piano-roll-v2.zip' }}"
          mkdir -p extracted
          unzip -o "$ZIP_NAME" -d extracted
          if [ -d "extracted/soundcraft-main" ]; then
            cp -r extracted/soundcraft-main/* .
            cp -r extracted/soundcraft-main/.[!.]* . 2>/dev/null || true
          else
            cp -r extracted/* .
            cp -r extracted/.[!.]* . 2>/dev/null || true
          fi
          ls -la

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build Soundcraft workspace
        run: cargo build --workspace
