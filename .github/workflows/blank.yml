impl SoundApp {
    /// Send an immediate MIDI Note-On (velocity > 0) or Note-Off (velocity == 0)
    /// into the live MIDI feed so the armed/selected instrument plays immediately.
    pub(crate) fn audition_midi_note(&mut self, pitch: u8, velocity: u8) {
        if self.midi_inputs.is_none()
            && let Some(p) = &self.player
        {
            let m = MidiInputs::open(self.ui.midi_inputs_off.clone());
            p.set_midi(std::sync::Arc::clone(m.feed()));
            self.midi_inputs = Some(m);
        }
        let pitch = pitch.min(127);
        let vel = velocity.min(127);
        let status = if vel > 0 { 0x90 } else { 0x80 };
        if let Some(m) = &self.midi_inputs {
            m.feed().receive(0, &[status, pitch, vel]);
        }
    }
}

